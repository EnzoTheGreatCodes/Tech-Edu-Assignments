<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Calculator</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="calculator" aria-label="Calculator">
		<div class="calculator-screen" aria-live="polite">
			<span class="previous-value" id="previousValue"></span>
			<span class="current-value" id="currentValue"></span>
		</div>
		<div class="delete-row">
			<button class="key key-delete" data-action="delete">DEL</button>
		</div>
		<div class="calculator-keys">
			<button class="key" data-number="1">1</button>
			<button class="key" data-number="2">2</button>
			<button class="key key-operator" data-operation="subtract">-</button>

			<button class="key" data-number="3">3</button>
			<button class="key" data-number="4">4</button>
			<button class="key key-operator" data-operation="add">+</button>

			<button class="key" data-number="5">5</button>
			<button class="key" data-number="6">6</button>
			<button class="key key-operator" data-operation="multiply">*</button>

			<button class="key" data-number="7">7</button>
			<button class="key" data-number="8">8</button>
			<button class="key key-operator" data-operation="divide">/</button>
			<button class="key" data-number="9">9</button>
			<button class="key" data-action="clear">C</button>
			<button class="key key-equals" data-action="equals">=</button>
		</div>
	</main>
	<script src="script.js"></script>
</body>
</html>
